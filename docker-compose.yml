version: '3.8'

services:
  mindbuddy-api:
    build: .
    container_name: mindbuddy-api
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      # MONGODB_URL must be set in your .env file — no default is provided here.
      # Running without .env will cause a startup failure (intentional — prevents
      # accidental connection to production Atlas with a leaked default credential).
      - MONGODB_URL=${MONGODB_URL:?MONGODB_URL must be set in .env}
      - DATABASE_NAME=${DATABASE_NAME:-mindbuddy_db}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Persists logs to the server
      - ./logs:/app/logs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: mindbuddy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
